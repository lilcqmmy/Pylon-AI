# Copy to config/config.yaml for local overrides (that file is git-ignored).
# Values here are starting points, not validated settings.
project:
  name: sports-forecasting-intelligence
  mode: research_no_money
  initial_league: NFL

dataset: synthetic              # default for `tune`/`backtest`; override with --dataset

# Season splits must be disjoint and ordered: burn-in < validation < holdout.
# Burn-in warms up ratings (never scored); tuning is scored on validation only; holdout stays sealed
# until `sfi backtest --reveal-holdout`, and every reveal is logged.
datasets:
  synthetic:
    seed: 20261015
    seasons: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    n_teams: 32
    weeks_per_season: 17
    splits:
      burn_in: 2017
      validation: 2018-2022
      holdout: 2023-2024

  nflverse:                     # real NFL; see docs/data_sources/nflverse_schedules.md
    raw_dir: data/raw/nflverse/schedules
    pbp_dir: data/raw/nflverse/pbp
    injuries_dir: data/raw/nflverse/injuries
    depth_charts_dir: data/raw/nflverse/depth_charts
    min_season: 2000            # 1999 has no kickoff times
    known_at_hours: 5           # result treated as known this long after kickoff
    splits:                     # fixed 2026-10-15 before any real-data results were viewed
      burn_in: 2000
      validation: 2001-2019
      holdout: 2020-2025

elo:                            # untuned defaults, reported as "elo_default"
  initial_rating: 1500.0
  k_factor: 20.0
  home_field_elo: 48.0          # in Elo points; not applied at neutral sites
  season_regression: 0.33       # fraction pulled back toward the mean between seasons
  margin_of_victory: true

tuning:                         # `sfi tune`: grid search scored ONLY on validation seasons
  objective: brier
  grid:
    k_factor: [2, 4, 6, 8, 12, 16, 20, 25, 30]
    home_field_elo: [0, 25, 48, 75, 100]
    season_regression: [0.2, 0.33, 0.5, 0.67]
    margin_of_victory: [true, false]
  artifact_dir: artifacts       # writes <dataset>_elo_tuned.json

features:
  pbp:                          # `sfi backtest --dataset nflverse --features pbp`
    l2: 10.0                    # ridge penalty on standardized features; fixed, not tuned
    min_samples: 200            # use Elo alone until this many past (non-tie) games are available
  qbadj:                        # `sfi backtest --dataset nflverse --features qbadj` (elo_qbadj); fixed by reasoning
    factor: 875.0               # Elo points per unit of qb_epa/dropback (~35 dropbacks x ~25 Elo per point)
    k_prior: 300.0
    prior_mean: 0.0
  sched:                        # `sfi backtest --dataset nflverse --features sched` (elo_sched)
    l2: 10.0                    # fixed, same as the other ridge layers
    min_samples: 200
  avail:                        # `sfi backtest --dataset nflverse --features avail` (elo_avail)
    l2: 10.0                    # same ridge penalty as the other feature models; fixed
    min_samples: 200
  qb:                           # `sfi backtest --dataset nflverse --features qb`
    k_prior: 300                # QB rating shrinkage: dropbacks of prior at prior_mean (untuned)
    prior_mean: 0.0             # qb_epa per dropback assumed for an unknown QB
    l2: 10.0                    # ridge penalty on standardized features; fixed, not tuned
    min_samples: 200
    missing_timestamp_hours: 24 # injury row known this long before kickoff when date_modified is missing

scores:                         # `sfi backtest-scores`: margin and total distributions
  residual_window: 2000         # past residuals used for the spread
  min_samples: 200              # default Normal(sd 13.5) until this many residuals exist
  points:                       # PointsModel settings (untuned starting values)
    k: 0.06
    k_league: 0.005
    k_home: 0.003
    season_regression: 0.4
    init_league: 20.5
    init_home: 2.5

players:                        # `sfi backtest-players` (untuned starting values)
  params:
    pool_games: 2
    min_opp: {pass: 10, rush: 3, rec: 2}
    k_player: {pass: 150.0, rush: 80.0, rec: 40.0}
    k_def: {pass: 300.0, rush: 150.0, rec: 300.0}
    volume_decay: 0.35
    residual_window: 4000
    min_k: 300

calibration:                    # Platt scaling refit walk-forward on past issued forecasts only
  method: platt
  min_samples: 200              # identity mapping until this many past (non-tie) forecasts exist
  exclude_first_season: true    # cold-start ratings are not representative

forecast:
  as_of_required: true
  as_of_lead_hours: 1           # each kickoff slate is forecast this long before kickoff
  publish_gate:
    allow_abstention: true
    min_prior_games_per_team: 0   # 0 = gate off; choose a value only after an empirical study
    minimum_calibrated_probability: null

live:                           # `sfi forecast` / `sfi score` (prospective, real data only)
  dataset: nflverse
  primary_model: elo_tuned      # headline model in printed output; all live models are archived
  primary_score_model: scores_points_empirical  # margin/total columns in printed output
  primary_player_model: players_opp_eff
  elo_hfa_home_k: 1.0           # challenger elo_hfa (docs/challenger_elo_hfa.md); fixed, do not tune
  line_move_threshold: 0.05     # report Elo vs closing line on games where |close - at issue| >= this
  player_thresholds:            # archived as P(yards >= x); integer yards, so no pushes
    pass: [200, 250, 300]
    rush: [50, 75, 100]
    rec: [50, 75, 100]
  max_pbp_gap_hours: 48         # skip player forecasts if play-by-play lags results by more than this
  horizon_days: 8               # forecast unplayed games kicking off within this window
  min_lead_minutes: 10          # never forecast a game closer than this to kickoff
  max_snapshot_age_hours: 24    # refuse to forecast from an older snapshot (run `sfi fetch`)

market:                         # market-residual family (docs/market_biases.md); lines are inputs ONLY here
  validation: 2006-2017
  holdout: 2018-2025            # sealed until the owner says otherwise
  l2: 10.0                      # ridge on indicators only; market slope unpenalized
  coef_bootstrap: 400
  artifact: artifacts/market_logit.json   # frozen fit written by `sfi market-validate`

paper_picks:                    # research tracking only, not wagering advice (src/sfi/picks.py)
  folder: ledger/paper_picks
  model: elo_tuned
  stake_edge: 0.03              # paper stake 1 unit if model P - raw market implied P >= this
  high: 0.10                    # confidence High if edge >= this
  medium: 0.05                  # Medium if edge >= this, else Low

validation:
  scheme: rolling_origin
  calibration_bins: 10
  bootstrap_samples: 2000

storage:
  prospective_ledger: ledger/prospective_forecasts.jsonl  # live pre-game forecasts (tracked in git)
  forecast_run_log: ledger/forecast_runs.jsonl            # one entry per `sfi forecast` run
  market_moves: ledger/market_moves.jsonl                 # closing vs at-issue market, per final game
  market_residual_ledger: ledger/market_residual/forecasts.jsonl  # market_logit (separate family)
  backtest_archive: archive/backtest_forecasts.jsonl      # walk-forward replays (git-ignored)
  score_archive: archive/score_forecasts.jsonl           # margin/total walk-forward replays
  player_archive: archive/player_forecasts.jsonl         # player yardage walk-forward replays
  holdout_reveal_log: archive/holdout_reveals.jsonl
  immutable_forecasts: true

model:
  llm_for_numeric_probability: false

secrets:
  guidance: environment_or_secret_manager_only
