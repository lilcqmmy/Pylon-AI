[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-forecasting-intelligence"
version = "0.1.0"
description = "Research-only, calibrated NFL forecasting with walk-forward evaluation (no-money)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tzdata>=2024.1",  # Windows has no system time-zone database for zoneinfo
    "pyarrow>=15",     # reading nflverse play-by-play parquet files
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sfi = "sfi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
